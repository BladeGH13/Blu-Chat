<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blu Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .typing-dot { animation: bounce 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }
    </style>
</head>
<body class="bg-white text-slate-900 h-screen flex flex-col font-sans select-none">

    <!-- Auth Screen -->
    <div id="auth-screen" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-white border border-slate-200 p-8 rounded-3xl w-full max-w-sm shadow-2xl text-center">
            <div class="w-16 h-16 bg-blue-500 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl font-bold shadow-lg shadow-blue-500/30 mb-4">
                💬
            </div>
            <h1 class="text-2xl font-bold text-slate-900 mb-1">BLUOM ID</h1>
            <p class="text-slate-500 mb-6 text-xs">Sign in or register to join the Blu Network.</p>
            <form id="auth-form" class="space-y-3">
                <input type="text" id="blu-id-input" required autocomplete="off" placeholder="BluOM ID (e.g. test1)" 
                    class="w-full bg-slate-100 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 text-center font-medium">
                <input type="password" id="password-input" required placeholder="Password" 
                    class="w-full bg-slate-100 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 text-center font-medium">
                <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 transition text-white font-semibold py-3 rounded-xl text-sm shadow-md shadow-blue-500/20">
                    Sign In / Register
                </button>
            </form>
        </div>
    </div>

    <!-- Main Layout -->
    <div class="flex-1 flex overflow-hidden">
        <!-- Sidebar -->
        <div class="w-80 bg-slate-50 border-r border-slate-200 flex flex-col">
            <div class="p-4 border-b border-slate-200 flex items-center justify-between">
                <div>
                    <h2 id="current-user-display" class="font-bold text-slate-900 text-lg">--</h2>
                    <span class="text-[11px] text-emerald-600 font-medium">● SQL Database Active</span>
                </div>
                <button onclick="localStorage.clear(); location.reload();" class="text-xs text-slate-400 hover:text-red-500 font-medium">Sign Out</button>
            </div>

            <!-- Quick Add Controls -->
            <div class="p-3 border-b border-slate-200 space-y-2 bg-slate-100/50">
                <form id="add-contact-form" class="flex gap-2">
                    <input type="text" id="contact-input" autocomplete="off" placeholder="Add Direct ID..." 
                        class="flex-1 bg-white border border-slate-200 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-blue-500">
                    <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold">Add</button>
                </form>
                <form id="create-group-form" class="flex gap-2">
                    <input type="text" id="group-input" autocomplete="off" placeholder="Create Group Name..." 
                        class="flex-1 bg-white border border-slate-200 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-blue-500">
                    <button type="submit" class="bg-slate-800 hover:bg-slate-900 text-white px-3 py-1.5 rounded-lg text-xs font-semibold">Group</button>
                </form>
            </div>

            <!-- Navigation Tabs -->
            <div class="flex border-b border-slate-200 text-xs font-semibold bg-slate-200/40">
                <button onclick="switchTab('chats')" id="tab-chats-btn" class="flex-1 py-2 text-blue-600 border-b-2 border-blue-500 bg-white">Chats</button>
                <button onclick="switchTab('directory')" id="tab-dir-btn" class="flex-1 py-2 text-slate-500">Directory</button>
            </div>

            <!-- Lists -->
            <div id="chats-list" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
            <div id="directory-list" class="flex-1 overflow-y-auto p-2 space-y-1 hidden"></div>
        </div>

        <!-- Chat Workspace -->
        <div class="flex-1 flex flex-col bg-white">
            <div id="active-chat-header" class="h-14 border-b border-slate-200 px-6 flex items-center justify-between font-semibold text-slate-800 shadow-sm bg-white/80 backdrop-blur">
                <span>Select a conversation</span>
                <div id="chat-actions" class="hidden flex items-center gap-2">
                    <button id="manage-group-btn" onclick="openGroupManager()" class="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-slate-700 hidden">Members</button>
                    <button onclick="deleteCurrentChat()" class="text-xs bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg">Delete Chat</button>
                </div>
            </div>

            <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-3 bg-gradient-to-b from-slate-50/50 to-white">
                <div class="text-center text-slate-400 my-auto text-xs">Select a contact or group from the sidebar to chat.</div>
            </div>

            <div id="typing-indicator" class="px-6 py-1 text-xs text-slate-400 italic hidden h-6">
                <span id="typing-user">Someone</span> is typing...
            </div>

            <form id="message-form" class="p-3 bg-white border-t border-slate-200 flex gap-2 items-center hidden">
                <input type="text" id="message-input" autocomplete="off" placeholder="Type a message..." 
                    class="flex-1 bg-slate-100 border border-slate-200 rounded-full px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500">
                <button type="submit" class="bg-blue-500 hover:bg-blue-600 w-9 h-9 rounded-full flex items-center justify-center text-white transition shadow-sm">
                    ↑
                </button>
            </form>
        </div>
    </div>

    <!-- Group Member Management Modal -->
    <div id="group-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl border border-slate-200">
            <h3 id="modal-group-title" class="font-bold text-lg text-slate-800 mb-2">Group Members</h3>
            <p class="text-xs text-slate-500 mb-4">Add users or view participants in this group chat.</p>
            <div id="group-members-list" class="space-y-2 max-h-48 overflow-y-auto mb-4 border border-slate-100 p-2 rounded-xl"></div>
            <div class="flex gap-2">
                <input type="text" id="add-member-input" placeholder="Add Blu ID..." class="flex-1 bg-slate-100 px-3 py-2 rounded-xl text-xs border border-slate-200 focus:outline-none">
                <button onclick="addGroupMember()" class="bg-blue-500 text-white px-4 py-2 rounded-xl text-xs font-semibold">Add</button>
            </div>
            <button onclick="closeGroupManager()" class="w-full mt-4 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 rounded-xl text-xs font-medium">Close</button>
        </div>
    </div>

    <script>
        let currentUser = localStorage.getItem('blu_current_user');
        let activeTarget = null;
        let isGroupChat = false;
        let chats = JSON.parse(localStorage.getItem('blu_chats') || '[]');
        let typingTimeout = null;

        const authScreen = document.getElementById('auth-screen');
        const authForm = document.getElementById('auth-form');
        const bluIdInput = document.getElementById('blu-id-input');
        const passwordInput = document.getElementById('password-input');
        const currentUserDisplay = document.getElementById('current-user-display');
        const chatsList = document.getElementById('chats-list');
        const directoryList = document.getElementById('directory-list');
        const addContactForm = document.getElementById('add-contact-form');
        const contactInput = document.getElementById('contact-input');
        const createGroupForm = document.getElementById('create-group-form');
        const groupInput = document.getElementById('group-input');
        const activeChatHeader = document.getElementById('active-chat-header');
        const chatActions = document.getElementById('chat-actions');
        const manageGroupBtn = document.getElementById('manage-group-btn');
        const chatMessages = document.getElementById('chat-messages');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const typingIndicator = document.getElementById('typing-indicator');
        const typingUserSpan = document.getElementById('typing-user');

        window.addEventListener('DOMContentLoaded', () => {
            if (currentUser) {
                authScreen.classList.add('hidden');
                currentUserDisplay.textContent = currentUser;
                renderChats();
                fetchDirectory();
                setInterval(pollMessages, 2500);
            }
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = bluIdInput.value.trim().toLowerCase();
            const password = passwordInput.value;
            if (!id || !password) return;

            const res = await fetch('api/auth.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ bluId: id, password: password })
            });
            const data = await res.json();

            if (data.success) {
                currentUser = id;
                localStorage.setItem('blu_current_user', currentUser);
                authScreen.classList.add('hidden');
                currentUserDisplay.textContent = currentUser;
                renderChats();
                fetchDirectory();
                setInterval(pollMessages, 2500);
            } else {
                alert(data.error || 'Authentication failed');
            }
        });

        function switchTab(tab) {
            if (tab === 'chats') {
                chatsList.classList.remove('hidden');
                directoryList.classList.add('hidden');
                document.getElementById('tab-chats-btn').className = "flex-1 py-2 text-blue-600 border-b-2 border-blue-500 bg-white";
                document.getElementById('tab-dir-btn').className = "flex-1 py-2 text-slate-500";
            } else {
                directoryList.classList.remove('hidden');
                chatsList.classList.add('hidden');
                document.getElementById('tab-dir-btn').className = "flex-1 py-2 text-blue-600 border-b-2 border-blue-500 bg-white";
                document.getElementById('tab-chats-btn').className = "flex-1 py-2 text-slate-500";
                fetchDirectory();
            }
        }

        async function fetchDirectory() {
            try {
                const res = await fetch('api/auth.php?action=directory');
                const users = await res.json();
                directoryList.innerHTML = '';
                users.forEach(user => {
                    if (user.blu_id === currentUser) return;
                    const btn = document.createElement('button');
                    btn.className = "w-full text-left px-3 py-2 rounded-xl transition text-xs font-medium flex items-center justify-between hover:bg-slate-200/60 text-slate-700";
                    btn.innerHTML = `<span>👤 ${user.blu_id}</span> <span class="text-[10px] text-blue-500 font-semibold">Start Chat</span>`;
                    btn.onclick = () => {
                        if (!chats.some(c => c.name === user.blu_id && !c.isGroup)) {
                            chats.push({ name: user.blu_id, isGroup: false });
                            localStorage.setItem('blu_chats', JSON.stringify(chats));
                        }
                        switchTab('chats');
                        renderChats();
                        selectChat(user.blu_id, false);
                    };
                    directoryList.appendChild(btn);
                });
            } catch (e) { console.error(e); }
        }

        addContactForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const target = contactInput.value.trim().toLowerCase();
            if (!target || target === currentUser) return;
            if (!chats.some(c => c.name === target && !c.isGroup)) {
                chats.push({ name: target, isGroup: false });
                localStorage.setItem('blu_chats', JSON.stringify(chats));
            }
            contactInput.value = '';
            renderChats();
        });

        createGroupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const gName = groupInput.value.trim().toLowerCase();
            if (!gName) return;

            await fetch('api/chat.php?action=creategroup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ group: gName, creator: currentUser })
            });

            if (!chats.some(c => c.name === gName && c.isGroup)) {
                chats.push({ name: gName, isGroup: true });
                localStorage.setItem('blu_chats', JSON.stringify(chats));
            }
            groupInput.value = '';
            renderChats();
            selectChat(gName, true);
        });

        function renderChats() {
            chatsList.innerHTML = '';
            if (chats.length === 0) {
                chatsList.innerHTML = `<div class="text-center text-slate-400 p-4 text-xs">No active chats. Add a direct contact or group above!</div>`;
                return;
            }
            chats.forEach(chat => {
                const btn = document.createElement('button');
                const isActive = activeTarget === chat.name && isGroupChat === chat.isGroup;
                btn.className = `w-full text-left px-3 py-2.5 rounded-xl transition text-xs font-medium flex items-center justify-between ${isActive ? 'bg-blue-500 text-white shadow-sm' : 'hover:bg-slate-200/60 text-slate-700'}`;
                btn.innerHTML = `<span>${chat.isGroup ? '👥 ' : '👤 '} ${chat.name}</span><span class="text-[10px] opacity-60">${chat.isGroup ? 'Group' : 'Direct'}</span>`;
                btn.onclick = () => selectChat(chat.name, chat.isGroup);
                chatsList.appendChild(btn);
            });
        }

        function selectChat(name, group) {
            activeTarget = name;
            isGroupChat = group;
            activeChatHeader.querySelector('span').textContent = (isGroupChat ? 'Group: ' : 'Chat with: ') + name;
            messageForm.classList.remove('hidden');
            chatActions.classList.remove('hidden');
            if (isGroupChat) {
                manageGroupBtn.classList.remove('hidden');
            } else {
                manageGroupBtn.classList.add('hidden');
            }
            renderChats();
            pollMessages();
        }

        function deleteCurrentChat() {
            if (!activeTarget) return;
            chats = chats.filter(c => !(c.name === activeTarget && c.isGroup === isGroupChat));
            localStorage.setItem('blu_chats', JSON.stringify(chats));
            activeTarget = null;
            isGroupChat = false;
            activeChatHeader.querySelector('span').textContent = 'Select a conversation';
            chatActions.classList.add('hidden');
            messageForm.classList.add('hidden');
            chatMessages.innerHTML = `<div class="text-center text-slate-400 my-auto text-xs">Conversation removed from your sidebar.</div>`;
            renderChats();
        }

        async function openGroupManager() {
            if (!isGroupChat || !activeTarget) return;
            document.getElementById('modal-group-title').textContent = `Group: ${activeTarget}`;
            const res = await fetch(`api/chat.php?action=getmembers&group=${encodeURIComponent(activeTarget)}`);
            const members = await res.json();
            const listContainer = document.getElementById('group-members-list');
            listContainer.innerHTML = '';
            members.forEach(m => {
                const item = document.createElement('div');
                item.className = "flex justify-between items-center bg-slate-50 px-3 py-1.5 rounded-lg text-xs";
                item.innerHTML = `<span>👤 ${m}</span>`;
                listContainer.appendChild(item);
            });
            document.getElementById('group-modal').classList.remove('hidden');
        }

        function closeGroupManager() {
            document.getElementById('group-modal').classList.add('hidden');
        }

        async function addGroupMember() {
            const newMember = document.getElementById('add-member-input').value.trim().toLowerCase();
            if (!newMember || !activeTarget) return;
            await fetch('api/chat.php?action=addmember', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ group: activeTarget, member: newMember })
            });
            document.getElementById('add-member-input').value = '';
            openGroupManager();
        }

        async function pollMessages() {
            if (!activeTarget || !currentUser) return;
            try {
                const endpoint = isGroupChat 
                    ? `api/chat.php?action=fetchgroup&group=${encodeURIComponent(activeTarget)}`
                    : `api/chat.php?action=fetchdirect&user=${encodeURIComponent(currentUser)}&target=${encodeURIComponent(activeTarget)}`;
                
                const res = await fetch(endpoint);
                const data = await res.json();
                renderMessages(data.messages || []);
                
                if (data.typing && data.typing !== currentUser) {
                    typingUserSpan.textContent = data.typing;
                    typingIndicator.classList.remove('hidden');
                } else {
                    typingIndicator.classList.add('hidden');
                }
            } catch (err) {
                console.error("Polling error:", err);
            }
        }

        function renderMessages(messages = []) {
            chatMessages.innerHTML = '';
            if (messages.length === 0) {
                chatMessages.innerHTML = `<div class="text-center text-slate-400 my-auto text-xs">No messages yet. Say hello!</div>`;
                return;
            }

            messages.forEach(msg => {
                const isMe = msg.sender === currentUser;
                const div = document.createElement('div');
                div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} mb-2`;
                
                let senderTag = (isGroupChat && !isMe) ? `<span class="text-[10px] text-slate-400 ml-3 mb-0.5">${msg.sender}</span>` : '';
                const timeString = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                div.innerHTML = `
                    ${senderTag}
                    <div class="max-w-xs md:max-w-md px-4 py-2 rounded-2xl text-sm leading-relaxed ${isMe ? 'bg-blue-500 text-white rounded-br-xs' : 'bg-slate-200 text-slate-900 rounded-bl-xs'}">
                        ${escapeHtml(msg.text)}
                    </div>
                    <span class="text-[9px] text-slate-400 mt-1 px-1">${timeString}</span>
                `;
                chatMessages.appendChild(div);
            });
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        messageInput.addEventListener('input', () => {
            if (!activeTarget) return;
            clearTimeout(typingTimeout);
            fetch('api/chat.php?action=typing', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sender: currentUser, target: activeTarget, isGroup: isGroupChat })
            });
        });

        messageForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text || !activeTarget) return;

            const payload = {
                sender: currentUser,
                target: activeTarget,
                text: text,
                isGroup: isGroupChat,
                timestamp: Date.now()
            };

            messageInput.value = '';

            await fetch('api/chat.php?action=send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            pollMessages();
        });

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
